<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101d35">
<meta name="description" content="An offline-first daily habit tracker with streaks, reports and habit analytics.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>HabitFlow — Daily Habit Tracker</title>
<style>
:root{--navy:#101d35;--navy2:#1b2c4b;--blue:#3977e8;--blue2:#eaf1ff;--green:#16865b;--greenbg:#e4f6ed;--red:#c34d55;--redbg:#fff0f0;--ink:#18243a;--muted:#718096;--line:#e6ebf2;--bg:#f4f6fa;--card:#fff;--shadow:0 8px 28px rgba(18,35,63,.06);--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:86px}.topbar{background:var(--navy);color:white;padding:18px max(18px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:12px;background:#2f70e7;display:grid;place-items:center;font-size:20px}.brand strong{font-size:18px;letter-spacing:.2px}.brand small{display:block;color:#b8c6dd;font-size:11px}.top-actions{display:flex;gap:8px;align-items:center}.top-actions button{background:#263958;color:#fff;border:1px solid #40516d;border-radius:10px;padding:9px 12px;font-size:13px}.wrap{max-width:1180px;margin:auto;padding:22px 18px}.welcome{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px}.welcome h1{font-size:25px;margin:0 0 4px;letter-spacing:-.5px}.welcome p{margin:0;color:var(--muted)}.date-chip{background:white;border:1px solid var(--line);padding:9px 12px;border-radius:12px;color:#53627a;font-size:13px;white-space:nowrap}
.nav{display:flex;gap:7px;overflow:auto;padding:5px;margin:0 0 18px;background:#e9edf4;border-radius:14px;scrollbar-width:none}.nav button{border:0;background:transparent;color:#617089;padding:10px 14px;border-radius:10px;white-space:nowrap;font-size:13px;font-weight:650}.nav button.active{background:white;color:var(--navy);box-shadow:0 2px 8px #15284712}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}.stat-label{color:var(--muted);font-size:12px;font-weight:650}.stat-value{font-size:28px;font-weight:780;letter-spacing:-1px;margin:8px 0 2px}.stat-foot{font-size:12px;color:var(--muted)}.stat-icon{float:right;background:var(--blue2);color:var(--blue);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px}.two{grid-template-columns:1.25fr .75fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.section-head h2{font-size:16px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.btn{border:0;border-radius:10px;padding:9px 13px;background:var(--blue);color:white;font-weight:650;font-size:13px}.btn.secondary{background:#edf2fa;color:#31435f}.btn.danger{background:var(--redbg);color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.progress{height:9px;background:#edf1f6;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue);border-radius:20px;transition:width .2s}.progress.green span{background:var(--green)}.habit-mini{display:grid;grid-template-columns:minmax(0,1fr) 90px 42px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #f0f2f6}.habit-mini:last-child{border:0}.habit-mini b{font-size:13px}.habit-mini small{display:block;color:var(--muted);font-size:11px}.habit-mini .pct{text-align:right;font-size:12px;font-weight:700}.empty{color:var(--muted);padding:22px;text-align:center;font-size:13px}.chart-wrap{height:220px;position:relative}.chart-wrap canvas{width:100%;height:100%}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.month-control{display:flex;align-items:center;gap:8px}.month-control button{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 11px;color:var(--ink)}.month-control strong{min-width:130px;text-align:center}.table-scroll{overflow:auto;border:1px solid var(--line);border-radius:13px}.tracker{border-collapse:separate;border-spacing:0;width:100%;min-width:680px;background:white}.tracker th,.tracker td{padding:9px 7px;text-align:center;border-bottom:1px solid #edf0f5;border-right:1px solid #f1f3f7;font-size:11px}.tracker th{background:#f8f9fc;color:#65738a;position:sticky;top:0;z-index:1}.tracker th:first-child,.tracker td:first-child{position:sticky;left:0;background:white;text-align:left;min-width:155px;z-index:2;padding-left:12px}.tracker th:first-child{background:#f8f9fc;z-index:3}.tracker .dayhead{min-width:34px}.tracker td button{border:0;width:25px;height:25px;border-radius:8px;background:#f0f2f6;color:#a0a9b8;font-size:13px}.tracker td button.done{background:var(--greenbg);color:var(--green)}.tracker td button.missed{background:var(--redbg);color:var(--red)}.tracker td button:disabled{opacity:.45;cursor:not-allowed}.tracker .today{outline:2px solid #9bbcff;outline-offset:-2px}.habit-cell{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650}.dot{width:8px;height:8px;border-radius:50%;flex:none}.muted{color:var(--muted)}.list-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eef1f5}.list-row:last-child{border:0}.list-row strong{font-size:13px}.list-row small{display:block;color:var(--muted);font-size:11px}.pill{padding:4px 8px;border-radius:20px;background:#eef3fc;color:#3c65a5;font-size:11px;font-weight:700;white-space:nowrap}.pill.good{background:var(--greenbg);color:var(--green)}.pill.bad{background:var(--redbg);color:var(--red)}
.form-row{display:flex;gap:8px;flex-wrap:wrap}.field{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 11px;color:var(--ink);min-width:0}.field:focus{outline:2px solid #c6d8ff;border-color:#8db0ff}.field.name{flex:1;min-width:170px}.habit-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}.habit-card h3{font-size:14px;margin:0 0 3px}.habit-card p{font-size:11px;color:var(--muted);margin:0}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}.metric{background:#f7f9fc;border-radius:11px;padding:10px}.metric b{font-size:18px;display:block}.metric small{font-size:10px;color:var(--muted)}.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.heat{height:28px;border-radius:6px;background:#eef1f5;position:relative}.heat.l1{background:#d8f0e3}.heat.l2{background:#a6dfbf}.heat.l3{background:#58b987}.heat.l4{background:#16865b}.heat .tip{display:none;position:absolute;bottom:32px;left:50%;transform:translateX(-50%);background:#14223a;color:white;padding:5px 7px;border-radius:6px;font-size:10px;white-space:nowrap;z-index:5}.heat:hover .tip{display:block}
.bottom-nav{display:none}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#15243d;color:white;padding:10px 15px;border-radius:10px;font-size:12px;box-shadow:var(--shadow);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.modal-back{position:fixed;inset:0;background:#0b172b88;display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal-back.show{display:flex}.modal{background:white;border-radius:18px;padding:20px;width:min(440px,100%);box-shadow:0 20px 70px #0003}.modal h2{font-size:18px;margin:0 0 14px}.modal .field{width:100%;margin-bottom:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.note{font-size:12px;color:var(--muted);line-height:1.6}.report-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.report-summary .metric{padding:14px}
@media(max-width:760px){.topbar{padding:13px 16px}.top-actions button .wide{display:none}.wrap{padding:17px 13px 24px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:15px;border-radius:15px}.stat-value{font-size:25px}.two,.three{grid-template-columns:1fr}.welcome h1{font-size:22px}.date-chip{font-size:11px;padding:7px 9px}.nav{display:none}.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:10}.bottom-nav button{border:0;background:transparent;color:#8290a5;font-size:10px;display:grid;justify-items:center;gap:3px;min-width:0;flex:1}.bottom-nav button span{font-size:18px}.bottom-nav button.active{color:var(--blue);font-weight:750}.metric-grid{grid-template-columns:repeat(2,1fr)}.report-summary{grid-template-columns:repeat(3,1fr)}.report-summary .metric{padding:10px}.report-summary .metric b{font-size:16px}.toolbar{align-items:flex-start}.habit-mini{grid-template-columns:minmax(0,1fr) 70px 36px}}
@media(min-width:761px){.wrap{padding-top:27px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="brand"><div class="logo">✓</div><div><strong>HabitFlow</strong><small>Small steps. Lasting change.</small></div></div>
 <div class="top-actions"><button id="installBtn" hidden>＋ <span class="wide">Install app</span></button><button id="exportBtn">⇩ <span class="wide">Backup</span></button><button id="importBtn">⇧ <span class="wide">Restore</span></button></div>
</header>
<main class="wrap">
 <div class="welcome"><div><h1 id="pageTitle">Your progress, at a glance</h1><p id="pageSub">Build consistency one day at a time.</p></div><div class="date-chip" id="todayLabel"></div></div>
 <nav class="nav" id="desktopNav"></nav>
 <section id="view"></section>
</main>
<nav class="bottom-nav" id="mobileNav"></nav>
</div>
<div class="toast" id="toast"></div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<input type="file" id="restoreFile" accept="application/json" hidden>
<script>
(() => {
'use strict';
const $=s=>document.querySelector(s);
const today=new Date(); today.setHours(0,0,0,0);
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monthKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const fmtMonth=d=>d.toLocaleDateString(undefined,{month:'long',year:'numeric'});
const fmtDate=d=>d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const uid=()=>Math.random().toString(36).slice(2,10);
const defaults=['Read / study','Exercise','Revise yesterday’s topics','English speaking practice','Write one answer','Meditation','Drink enough water','Wake up on time','Current affairs','Handwriting practice','No unnecessary scrolling','Plan tomorrow','Sleep on time','Walk outdoors','Reflect on the day'];
const colors=['#3977e8','#16865b','#9a70d6','#d18b35','#2995a5','#d46c83','#6680ad'];
function fresh(){return {version:1,habits:defaults.map((name,i)=>({id:uid(),name,color:colors[i%colors.length],active:true,created:iso(today)})),logs:{},created:iso(today)}}
let state;
try{state=JSON.parse(localStorage.getItem('habitflow_data'))||fresh()}catch{state=fresh()}
function save(){localStorage.setItem('habitflow_data',JSON.stringify(state))}
function activeHabits(){return state.habits.filter(h=>h.active)}
function isDone(id,date){return state.logs[date]?.[id]===true}
function setDone(id,date,val){if(!state.logs[date])state.logs[date]={};state.logs[date][id]=val;save();render()}
function datesBetween(start,end){let a=[];for(let d=new Date(start);d<=end;d=addDays(d,1))a.push(iso(d));return a}
function completion(habits,dates){const past=dates.filter(d=>parse(d)<=today);let total=habits.length*past.length,done=0;for(const d of past)for(const h of habits)if(isDone(h.id,d))done++;return total?Math.round(done/total*100):0}
function habitStats(h){const all=Object.keys(state.logs).sort();const valid=all.filter(d=>parse(d)<=today);let done=valid.filter(d=>isDone(h.id,d)).length,miss=valid.length-done;let cur=0;let streakStart=isDone(h.id,iso(today))?new Date(today):addDays(today,-1);for(let d=streakStart;;d=addDays(d,-1)){if(isDone(h.id,iso(d)))cur++;else break;if(cur>5000)break}let best=0,run=0,prev=null;for(const s of valid){const d=parse(s);if(isDone(h.id,s)){run=prev&&Math.round((d-prev)/86400000)===1?run+1:1;best=Math.max(best,run);prev=d}else{run=0;prev=null}}return {done,miss,pct:valid.length?Math.round(done/valid.length*100):0,cur,best,valid:valid.length}}
function overallStreak(){let n=0;for(let d=new Date(today);;d=addDays(d,-1)){const ds=iso(d),hs=activeHabits();if(hs.length&&hs.every(h=>isDone(h.id,ds)))n++;else break;if(n>5000)break}return n}
function weekDates(date){const d=new Date(date),day=(d.getDay()+6)%7;const start=addDays(d,-day);return datesBetween(start,addDays(start,6))}
function monthDates(date){const start=new Date(date.getFullYear(),date.getMonth(),1),end=new Date(date.getFullYear(),date.getMonth()+1,0);return datesBetween(start,end).filter(s=>parse(s)<=today)}
function habitPct(h,dates){const past=dates.filter(s=>parse(s)<=today);return past.length?Math.round(past.filter(s=>isDone(h.id,s)).length/past.length*100):0}
const tabs=[['dashboard','▦','Dashboard'],['tracker','☑','Daily'],['analysis','◒','Analysis'],['weekly','▤','Weekly'],['monthly','▦','Monthly'],['settings','⚙','Settings']];
let page='dashboard',viewMonth=new Date(today.getFullYear(),today.getMonth(),1),selectedHabit=null;
function nav(){const markup=tabs.map(([id,ic,n])=>`<button data-page="${id}" class="${page===id?'active':''}"><span>${ic}</span>${n}</button>`).join('');$('#desktopNav').innerHTML=markup;$('#mobileNav').innerHTML=markup;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function statCard(label,val,foot,icon){return `<div class="card"><span class="stat-icon">${icon}</span><div class="stat-label">${label}</div><div class="stat-value">${val}</div><div class="stat-foot">${foot}</div></div>`}
function habitList(habits,dates){if(!habits.length)return '<div class="empty">No active habits yet. Add one in Habit Settings.</div>';return habits.map(h=>{let p=habitPct(h,dates);return `<div class="habit-mini"><div><b>${esc(h.name)}</b><small>${dates.filter(d=>isDone(h.id,d)).length} completed</small></div><div class="progress green"><span style="width:${p}%"></span></div><div class="pct">${p}%</div></div>`}).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dashboard(){const hs=activeHabits(),w=weekDates(today),m=monthDates(today),d=[iso(today)],dayp=completion(hs,d),wp=completion(hs,w),mp=completion(hs,m),rank=hs.map(h=>({h,p:habitPct(h,m)})).sort((a,b)=>b.p-a.p),done=hs.filter(h=>isDone(h.id,iso(today))).length,pending=Math.max(0,hs.length-done);return `
<div class="grid stats">${statCard('Active habits',hs.length,'Your current routine','✦')}${statCard('Today completed',dayp+'%',`${done} done · ${pending} pending`,'✓')}${statCard('This week',wp+'%', 'Week-to-date consistency','▤')}${statCard('This month',mp+'%', 'Month-to-date consistency','◷')}</div>
<div class="grid two"><div class="card"><div class="section-head"><div><h2>Today’s checklist</h2><p>${fmtDate(today)} · Tap to update</p></div><button class="btn small" data-go="tracker">Open tracker</button></div>${hs.slice(0,7).map(h=>`<div class="list-row"><div><strong>${esc(h.name)}</strong><small>${isDone(h.id,iso(today))?'Completed today':'Not completed yet'}</small></div><button class="btn small ${isDone(h.id,iso(today))?'secondary':''}" data-toggle="${h.id}">${isDone(h.id,iso(today))?'Undo':'Mark done'}</button></div>`).join('')}${hs.length>7?`<p class="note">Showing 7 of ${hs.length} habits.</p>`:''}</div>
<div class="card"><div class="section-head"><div><h2>Consistency snapshot</h2><p>All habits measured separately</p></div></div><div class="metric-grid"><div class="metric"><b>${overallStreak()}</b><small>Overall streak (days)</small></div><div class="metric"><b>${rank[0]?.p??0}%</b><small>Best habit</small></div><div class="metric"><b>${rank.at(-1)?.p??0}%</b><small>Needs attention</small></div><div class="metric"><b>${Object.keys(state.logs).length}</b><small>Days with records</small></div></div><div class="list-row"><div><strong>🏆 ${rank[0]?esc(rank[0].h.name):'No habits'}</strong><small>Best performing this month</small></div><span class="pill good">${rank[0]?.p??0}%</span></div><div class="list-row"><div><strong>↗ ${rank.at(-1)?esc(rank.at(-1).h.name):'No habits'}</strong><small>Most room to improve</small></div><span class="pill bad">${rank.at(-1)?.p??0}%</span></div></div></div>
<div class="grid two" style="margin-top:14px"><div class="card"><div class="section-head"><div><h2>Habit performance</h2><p>Month-to-date completion by habit</p></div><button class="btn small secondary" data-go="analysis">Details</button></div>${habitList(hs,m)}</div><div class="card"><div class="section-head"><div><h2>Last 14 days</h2><p>Overall daily completion trend</p></div></div><div class="chart-wrap"><canvas id="trendChart"></canvas></div></div></div>`}
function tracker(){const y=viewMonth.getFullYear(),m=viewMonth.getMonth(),days=new Date(y,m+1,0).getDate(),hs=activeHabits();let head=Array.from({length:days},(_,i)=>{let d=new Date(y,m,i+1),s=iso(d);return `<th class="dayhead ${s===iso(today)?'today':''}">${i+1}<br>${d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,1)}</th>`}).join('');let rows=hs.map(h=>`<tr><td><div class="habit-cell"><span class="dot" style="background:${h.color}"></span>${esc(h.name)}</div></td>${Array.from({length:days},(_,i)=>{let s=iso(new Date(y,m,i+1)),done=isDone(h.id,s),future=parse(s)>today;return `<td class="${s===iso(today)?'today':''}"><button class="${done?'done':''}" data-date="${s}" data-habit="${h.id}" ${future?'disabled':''} aria-label="${esc(h.name)} ${s} ${done?'done':'not done'}">${done?'✓':'·'}</button></td>`}).join('')}</tr>`).join('');return `<div class="toolbar"><div><h2 style="margin:0;font-size:17px">Daily habit checklist</h2><p class="note" style="margin:3px 0 0">Green = completed · Grey = not completed · Future dates are locked</p></div><div class="month-control"><button id="prevMonth">‹</button><strong>${fmtMonth(viewMonth)}</strong><button id="nextMonth">›</button></div></div><div class="card" style="padding:12px"><div class="section-head"><div><h2>Monthly grid</h2><p>Tap any date cell to toggle completion</p></div><span class="pill">${completion(hs,datesBetween(new Date(y,m,1),new Date(y,m+1,0)).filter(s=>parse(s)<=today))}% month</span></div><div class="table-scroll"><table class="tracker"><thead><tr><th>Habit / date</th>${head}</tr></thead><tbody>${rows||'<tr><td colspan="32" class="empty">Add habits in Settings to start tracking.</td></tr>'}</tbody></table></div><p class="note" style="margin:12px 3px 0">Your records are saved on this device automatically. Use Backup regularly to keep a copy.</p></div>`}
function analysis(){const hs=activeHabits();let chosen=hs.find(h=>h.id===selectedHabit)||hs[0];if(!chosen)return '<div class="card empty">No active habits. Add a habit in Settings.</div>';selectedHabit=chosen.id;const st=habitStats(chosen),w=habitPct(chosen,weekDates(today)),m=habitPct(chosen,monthDates(today));return `<div class="toolbar"><div><h2 style="margin:0;font-size:17px">Individual habit analysis</h2><p class="note" style="margin:3px 0">Each habit is measured independently across recorded calendar days.</p></div><select class="field" id="habitSelect">${hs.map(h=>`<option value="${h.id}" ${h.id===chosen.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select></div><div class="card"><div class="section-head"><div><h2>${esc(chosen.name)}</h2><p>Personal consistency profile</p></div><span class="pill">${st.pct}% lifetime</span></div><div class="progress green"><span style="width:${st.pct}%"></span></div><div class="metric-grid"><div class="metric"><b>${st.done}</b><small>Days completed</small></div><div class="metric"><b>${st.miss}</b><small>Days missed*</small></div><div class="metric"><b>${st.cur}</b><small>Current streak</small></div><div class="metric"><b>${st.best}</b><small>Longest streak</small></div></div><div class="grid three"><div class="metric"><b>${w}%</b><small>Weekly completion</small></div><div class="metric"><b>${m}%</b><small>Monthly completion</small></div><div class="metric"><b>${st.pct}%</b><small>Overall completion</small></div></div><p class="note">*Missed days are days with a recorded tracking date where this habit was not marked complete. Untracked future days are excluded.</p></div><div class="grid two" style="margin-top:14px"><div class="card"><div class="section-head"><div><h2>30-day trend</h2><p>Daily completion for this habit</p></div></div><div class="chart-wrap"><canvas id="habitChart"></canvas></div></div><div class="card"><div class="section-head"><div><h2>Recent activity</h2><p>Last 14 calendar days</p></div></div>${datesBetween(addDays(today,-13),today).reverse().map(s=>`<div class="list-row"><div><strong>${fmtDate(parse(s))}</strong></div><span class="pill ${isDone(chosen.id,s)?'good':'bad'}">${isDone(chosen.id,s)?'Completed':'Not done'}</span></div>`).join('')}</div></div>`}
function weekly(){const w=weekDates(today),hs=activeHabits(),p=completion(hs,w);return `<div class="card"><div class="section-head"><div><h2>This week</h2><p>${fmtDate(parse(w[0]))} – ${fmtDate(parse(w[6]))}</p></div><span class="pill">${p}% complete</span></div><div class="report-summary"><div class="metric"><b>${p}%</b><small>Overall completion</small></div><div class="metric"><b>${w.filter(d=>hs.length&&hs.every(h=>isDone(h.id,d))).length}</b><small>Perfect days</small></div><div class="metric"><b>${hs.length}</b><small>Active habits</small></div></div><div style="margin-top:18px"><div class="section-head"><h2>Habit-wise weekly performance</h2></div>${hs.map(h=>{let v=habitPct(h,w);return `<div class="habit-mini"><div><b>${esc(h.name)}</b><small>${w.filter(d=>isDone(h.id,d)).length} / ${w.length} days</small></div><div class="progress green"><span style="width:${v}%"></span></div><div class="pct">${v}%</div></div>`}).join('')}</div></div><div class="card" style="margin-top:14px"><div class="section-head"><div><h2>Daily consistency</h2><p>Completion rate for each day this week</p></div></div><div class="chart-wrap"><canvas id="weekChart"></canvas></div></div>`}
function monthly(){const hs=activeHabits(),m=monthDates(today),p=completion(hs,m),rank=hs.map(h=>({h,p:habitPct(h,m)})).sort((a,b)=>b.p-a.p);const first=new Date(today.getFullYear(),today.getMonth(),1),offset=(first.getDay()+6)%7,days=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();let cells=Array(offset).fill('<div></div>').concat(Array.from({length:days},(_,i)=>{let d=iso(new Date(today.getFullYear(),today.getMonth(),i+1)),n=hs.filter(h=>isDone(h.id,d)).length,v=hs.length?n/hs.length:0,lv=v===0?'':v<.25?'l1':v<.5?'l2':v<.75?'l3':'l4';return `<div class="heat ${lv}" title="${d}: ${n}/${hs.length} complete"><span class="tip">${d}: ${n}/${hs.length}</span></div>`})).join('');let prev=new Date(today.getFullYear(),today.getMonth()-1,1),prevDates=datesBetween(new Date(prev.getFullYear(),prev.getMonth(),1),new Date(prev.getFullYear(),prev.getMonth()+1,0)).filter(s=>parse(s)<=today);let prevP=completion(hs,prevDates);return `<div class="card"><div class="section-head"><div><h2>${fmtMonth(today)}</h2><p>Monthly performance overview</p></div><span class="pill">${p}% complete</span></div><div class="report-summary"><div class="metric"><b>${p}%</b><small>Completion rate</small></div><div class="metric"><b>${m.filter(d=>hs.length&&hs.every(h=>isDone(h.id,d))).length}</b><small>Perfect days</small></div><div class="metric"><b>${hs.length}</b><small>Active habits</small></div></div><div class="section-head" style="margin-top:20px"><div><h2>Daily completion heatmap</h2><p>Mon–Sun · darker green means stronger completion</p></div></div><div class="heatmap">${['M','T','W','T','F','S','S'].map(x=>`<div class="note" style="text-align:center">${x}</div>`).join('')}${cells}</div></div><div class="grid two" style="margin-top:14px"><div class="card"><div class="section-head"><div><h2>Habit comparison</h2><p>Completion by habit this month</p></div></div>${habitList(hs,m)}</div><div class="card"><div class="section-head"><div><h2>Month-on-month</h2><p>Current month compared with previous month</p></div></div><div class="metric-grid"><div class="metric"><b>${p}%</b><small>Current month</small></div><div class="metric"><b>${prevP}%</b><small>Previous month*</small></div><div class="metric"><b>${p-prevP>0?'+':''}${p-prevP} pts</b><small>Difference</small></div></div><p class="note">*Previous month uses recorded dates up to the same day number as today, where available. This comparison is a simple consistency indicator.</p><div class="list-row"><div><strong>Best habit</strong><small>${rank[0]?esc(rank[0].h.name):'—'}</small></div><span class="pill good">${rank[0]?.p??0}%</span></div><div class="list-row"><div><strong>Needs attention</strong><small>${rank.at(-1)?esc(rank.at(-1).h.name):'—'}</small></div><span class="pill bad">${rank.at(-1)?.p??0}%</span></div></div></div>`}
function settings(){return `<div class="grid two"><div class="card"><div class="section-head"><div><h2>Your habits</h2><p>${activeHabits().length} active · ${state.habits.length} total slots used</p></div></div><form id="addForm" class="form-row"><input class="field name" id="newHabit" maxlength="45" placeholder="e.g. Read for 30 minutes" required><button class="btn">＋ Add habit</button></form><p class="note" style="margin-top:9px">You can manage up to 50 habits. Deactivating a habit hides it from daily tracking but preserves its historical data.</p><div style="margin-top:12px">${state.habits.map(h=>`<div class="list-row"><div style="display:flex;align-items:center;gap:9px;min-width:0"><span class="dot" style="background:${h.color}"></span><div><strong>${esc(h.name)}</strong><small>${h.active?'Active':'Inactive'} · History retained</small></div></div><div class="form-row"><button class="btn small secondary" data-edit="${h.id}">Edit</button><button class="btn small ${h.active?'danger':'secondary'}" data-active="${h.id}">${h.active?'Pause':'Activate'}</button></div></div>`).join('')}</div></div><div class="card"><div class="section-head"><div><h2>Data & privacy</h2><p>Stored locally on this device</p></div></div><div class="list-row"><div><strong>Automatic saving</strong><small>Changes save as you make them</small></div><span class="pill good">On</span></div><div class="list-row"><div><strong>Offline mode</strong><small>Works after the first successful load</small></div><span class="pill good" id="offlineStatus">Ready</span></div><div class="list-row"><div><strong>Backup your data</strong><small>Download a JSON backup file</small></div><button class="btn small secondary" id="backup2">Backup</button></div><div class="list-row"><div><strong>Restore data</strong><small>Replace data using a previous backup</small></div><button class="btn small secondary" id="restore2">Restore</button></div><p class="note" style="margin-top:14px">Important: clearing browser/site data or uninstalling the app may erase local records. Export a backup regularly and keep it somewhere safe.</p></div></div><div class="card" style="margin-top:14px"><h2 style="font-size:15px;margin:0 0 8px">How to use HabitFlow</h2><ol class="note" style="padding-left:19px"><li>Add, rename or pause habits in Habit Settings.</li><li>Open Daily Tracker and tap a date cell to mark a habit complete.</li><li>Use Dashboard for a quick overview and Habit Analysis for individual streaks.</li><li>Weekly and Monthly Reports show consistency trends and comparisons.</li><li>Use Backup to export your records; Restore imports a previous backup.</li><li>Navigate between months with the arrows in Daily Tracker. Historical data remains saved.</li></ol></div>`}
function drawChart(canvasId,labels,values){const c=document.getElementById(canvasId);if(!c)return;const ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,dpr=window.devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);const pad={l:28,r:10,t:12,b:28},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;ctx.font='10px system-ui';ctx.strokeStyle='#e8edf4';ctx.fillStyle='#8390a4';ctx.lineWidth=1;for(let v=0;v<=100;v+=25){let y=pad.t+ch*(1-v/100);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(v+'%',1,y+3)}if(!values.length)return;const step=values.length>1?cw/(values.length-1):cw;ctx.beginPath();values.forEach((v,i)=>{let x=pad.l+i*step,y=pad.t+ch*(1-v/100);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.strokeStyle='#3977e8';ctx.lineWidth=2.5;ctx.stroke();values.forEach((v,i)=>{let x=pad.l+i*step,y=pad.t+ch*(1-v/100);ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle='#3977e8';ctx.fill()});const count=Math.min(labels.length,7);for(let i=0;i<count;i++){let idx=Math.round(i*(labels.length-1)/Math.max(1,count-1)),x=pad.l+idx*step;ctx.fillStyle='#8390a4';ctx.textAlign='center';ctx.fillText(labels[idx],x,h-7)}}
function drawCharts(){if(page==='dashboard'){let ds=datesBetween(addDays(today,-13),today),hs=activeHabits(),vals=ds.map(d=>hs.length?Math.round(hs.filter(h=>isDone(h.id,d)).length/hs.length*100):0);drawChart('trendChart',ds.map(d=>parse(d).getDate().toString()),vals)}if(page==='analysis'){let h=state.habits.find(x=>x.id===selectedHabit),ds=datesBetween(addDays(today,-29),today);drawChart('habitChart',ds.map(d=>parse(d).getDate().toString()),ds.map(d=>isDone(h.id,d)?100:0))}if(page==='weekly'){let ds=weekDates(today),hs=activeHabits();drawChart('weekChart',ds.map(d=>parse(d).toLocaleDateString(undefined,{weekday:'short'})),ds.map(d=>hs.length?Math.round(hs.filter(h=>isDone(h.id,d)).length/hs.length*100):0))}}
function bind(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>setDone(b.dataset.toggle,iso(today),!isDone(b.dataset.toggle,iso(today))));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll('[data-habit][data-date]').forEach(b=>b.onclick=()=>setDone(b.dataset.habit,b.dataset.date,!isDone(b.dataset.habit,b.dataset.date)));if($('#prevMonth'))$('#prevMonth').onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1);render()};if($('#nextMonth'))$('#nextMonth').onclick=()=>{viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1);render()};if($('#habitSelect'))$('#habitSelect').onchange=e=>{selectedHabit=e.target.value;render()};if($('#addForm'))$('#addForm').onsubmit=e=>{e.preventDefault();let name=$('#newHabit').value.trim();if(!name)return;if(state.habits.length>=50){toast('Maximum of 50 habits reached');return}state.habits.push({id:uid(),name,color:colors[state.habits.length%colors.length],active:true,created:iso(today)});save();render();toast('Habit added')};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editHabit(b.dataset.edit));document.querySelectorAll('[data-active]').forEach(b=>b.onclick=()=>{let h=state.habits.find(x=>x.id===b.dataset.active);h.active=!h.active;save();render()});if($('#backup2'))$('#backup2').onclick=backup;if($('#restore2'))$('#restore2').onclick=()=>$('#restoreFile').click()}
function editHabit(id){let h=state.habits.find(x=>x.id===id);$('#modal').innerHTML=`<h2>Edit habit</h2><input class="field" id="editName" maxlength="45" value="${esc(h.name)}"><div class="modal-actions"><button class="btn secondary" id="cancelEdit">Cancel</button><button class="btn" id="saveEdit">Save changes</button></div>`;$('#modalBack').classList.add('show');$('#cancelEdit').onclick=()=>$('#modalBack').classList.remove('show');$('#saveEdit').onclick=()=>{let v=$('#editName').value.trim();if(!v){toast('Enter a habit name');return}h.name=v;save();$('#modalBack').classList.remove('show');render();toast('Habit updated')}}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=`habitflow-backup-${iso(today)}.json`;a.click();URL.revokeObjectURL(url);toast('Backup downloaded')}
function restore(file){const r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.habits||!d.logs)throw Error();if(!confirm('Restore this backup? Current app data will be replaced.'))return;state=d;save();render();toast('Backup restored')}catch{alert('This file is not a valid HabitFlow backup.')}};r.readAsText(file)}
function render(){nav();$('#todayLabel').textContent=fmtDate(today);const titles={dashboard:['Your progress, at a glance','Build consistency one day at a time.'],tracker:['Daily habit tracker','A simple check-in for every habit, every day.'],analysis:['Know each habit deeply','Track progress, missed days and personal streaks.'],weekly:['Your weekly report','Spot patterns and build a stronger routine.'],monthly:['Your monthly report','See consistency over time, one day at a time.'],settings:['Make the routine yours','Manage habits and protect your tracking history.']};$('#pageTitle').textContent=titles[page][0];$('#pageSub').textContent=titles[page][1];$('#view').innerHTML=({dashboard,tracker,analysis,weekly,monthly,settings})[page]();bind();requestAnimationFrame(drawCharts)}
$('#exportBtn').onclick=backup;$('#importBtn').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=''};$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')$('#modalBack').classList.remove('show')};
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').hidden=false});$('#installBtn').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#installBtn').hidden=true}else toast('Use your browser menu and choose Install app')};
if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
window.addEventListener('resize',()=>requestAnimationFrame(drawCharts));
render();
})();
</script>
